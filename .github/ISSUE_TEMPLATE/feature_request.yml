name: Feature idea
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem it solves or how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else?
      description: Tools that already do this, mockups, or how you work around it today.
